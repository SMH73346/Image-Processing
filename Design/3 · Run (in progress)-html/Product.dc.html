<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Product image</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
<link rel="stylesheet" href="./studio.css">
</head>
<body>
<x-dc>
<helmet>
<style>body{margin:0}</style>
</helmet>
<div class="pimg {{bgClass}}" style="{{bgStyle}}">
<sc-if value="{{showShadow}}" hint-placeholder-val="{{true}}"><div class="pshadow" style="width: {{shW}}%; height: {{shH}}%; left: {{shL}}%; top: {{shT}}%; opacity: {{shO}}"></div></sc-if>

<sc-if value="{{isRca}}" hint-placeholder-val="{{true}}">
<svg viewBox="0 0 200 200" role="img" aria-label="{{label}}" style="width: {{scale}}%; height: {{scale}}%">
<defs><g id="pis-rca"><rect x="-6" y="-4" width="12" height="10" rx="3" class="k-blk2"></rect><rect x="-8" y="4" width="16" height="26" rx="3" class="k-blk"></rect><rect x="-8" y="12" width="16" height="3" class="k-gold"></rect><rect x="-7" y="30" width="14" height="7" rx="1" class="k-gold"></rect><rect x="-5" y="31" width="3" height="5" class="k-gold2"></rect><rect x="-2" y="37" width="4" height="10" rx="1.5" class="k-gold2"></rect></g></defs>
<path d="M50 140 C 42 50, 158 50, 150 140" class="k-cab w9"></path>
<path d="M50 140 C 42 50, 158 50, 150 140" class="k-sheen"></path>
<path d="M66 142 C 62 74, 138 74, 134 142" class="k-cab w9"></path>
<path d="M66 142 C 62 74, 138 74, 134 142" class="k-sheen"></path>
<sc-if value="{{isPhono}}" hint-placeholder-val="{{false}}"><path d="M100 72 C 108 104, 84 124, 100 156" class="k-cab w3"></path><rect x="97" y="154" width="6" height="10" rx="1" class="k-blk"></rect><path d="M96 164 h8 v10 h-2 v-6 h-4 v6 h-2 z" class="k-gold2"></path></sc-if>
<use href="#pis-rca" x="50" y="140"></use>
<use href="#pis-rca" x="150" y="140"></use>
<use href="#pis-rca" x="66" y="142"></use>
<use href="#pis-rca" x="134" y="142"></use>
</svg>
</sc-if>

<sc-if value="{{isSpeaker}}" hint-placeholder-val="{{false}}">
<svg viewBox="0 0 200 200" role="img" aria-label="{{label}}" style="width: {{scale}}%; height: {{scale}}%">
<defs><g id="pis-spade"><rect x="-10" y="-26" width="20" height="28" rx="5" class="k-blk"></rect><rect x="-10" y="-16" width="20" height="3" class="k-gold"></rect><rect x="-7" y="-32" width="14" height="7" rx="1" class="k-gold"></rect><path d="M-5 -32 v-8 h-4 v-14 h7 v9 h4 v-9 h7 v14 h-4 v8 z" class="k-gold2"></path></g></defs>
<path d="M34 62 C 120 10, 70 190, 166 138" class="k-cab w14"></path>
<path d="M34 62 C 120 10, 70 190, 166 138" class="k-sheen"></path>
<path d="M36 70 C 122 18, 72 198, 164 146" class="k-cab w3" style="stroke: #2a2a2c"></path>
<g transform="translate(34 62) rotate(-121)"><use href="#pis-spade"></use></g>
<g transform="translate(166 138) rotate(61)"><use href="#pis-spade"></use></g>
</svg>
</sc-if>

<sc-if value="{{isPower}}" hint-placeholder-val="{{false}}">
<svg viewBox="0 0 200 200" role="img" aria-label="{{label}}" style="width: {{scale}}%; height: {{scale}}%">
<path d="M48 58 C 14 140, 120 186, 152 112" class="k-cab w12"></path>
<path d="M48 58 C 14 140, 120 186, 152 112" class="k-sheen"></path>
<g transform="translate(48 58) rotate(22)"><rect x="-12" y="-8" width="24" height="10" rx="3" class="k-blk2"></rect><rect x="-17" y="-42" width="34" height="36" rx="6" class="k-blk"></rect><rect x="-17" y="-20" width="34" height="3" class="k-gold"></rect><rect x="-10" y="-39" width="4" height="9" class="k-slot"></rect><rect x="-2" y="-39" width="4" height="9" class="k-slot"></rect><rect x="6" y="-39" width="4" height="9" class="k-slot"></rect></g>
<g transform="translate(152 112) rotate(23)"><rect x="-8" y="-8" width="16" height="10" rx="3" class="k-blk2"></rect><rect x="-20" y="-48" width="40" height="42" rx="7" class="k-blk"></rect><circle cx="0" cy="-27" r="3" class="k-gold"></circle><rect x="-15" y="-56" width="5" height="9" class="k-sil"></rect><rect x="10" y="-56" width="5" height="9" class="k-sil"></rect><rect x="-3" y="-60" width="6" height="13" class="k-sil"></rect></g>
</svg>
</sc-if>

<sc-if value="{{isBox}}" hint-placeholder-val="{{false}}">
<svg viewBox="0 0 200 200" role="img" aria-label="{{label}}" style="width: {{scale}}%; height: {{scale}}%">
<polygon points="18,88 42,70 186,70 162,88" class="k-blk2"></polygon>
<rect x="18" y="88" width="144" height="62" class="k-blk"></rect>
<polygon points="162,88 186,70 186,132 162,150" class="k-blk3"></polygon>
<rect x="22" y="92" width="136" height="20" rx="2" class="k-sil"></rect>
<rect x="22" y="108" width="136" height="4" class="k-sil2"></rect>
<rect x="30" y="99" width="34" height="4" rx="1" class="k-blk2"></rect>
<circle cx="146" cy="101" r="3.5" class="k-gold"></circle>
<rect x="28" y="118" width="26" height="24" rx="3" class="k-blk2"></rect><rect x="39" y="122" width="4" height="6" class="k-slot"></rect><rect x="33" y="132" width="5" height="4" class="k-slot"></rect><rect x="44" y="132" width="5" height="4" class="k-slot"></rect>
<rect x="62" y="118" width="26" height="24" rx="3" class="k-blk2"></rect><rect x="73" y="122" width="4" height="6" class="k-slot"></rect><rect x="67" y="132" width="5" height="4" class="k-slot"></rect><rect x="78" y="132" width="5" height="4" class="k-slot"></rect>
<rect x="96" y="118" width="26" height="24" rx="3" class="k-blk2"></rect><rect x="107" y="122" width="4" height="6" class="k-slot"></rect><rect x="101" y="132" width="5" height="4" class="k-slot"></rect><rect x="112" y="132" width="5" height="4" class="k-slot"></rect>
<rect x="130" y="118" width="26" height="24" rx="3" class="k-blk2"></rect><rect x="141" y="122" width="4" height="6" class="k-slot"></rect><rect x="135" y="132" width="5" height="4" class="k-slot"></rect><rect x="146" y="132" width="5" height="4" class="k-slot"></rect>
<rect x="26" y="150" width="14" height="4" class="k-sil2"></rect><rect x="140" y="150" width="14" height="4" class="k-sil2"></rect>
</svg>
</sc-if>

<sc-if value="{{raw}}" hint-placeholder-val="{{false}}"><div class="raw-glare"></div></sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"kind":{"editor":"enum","options":["rca","phono","speaker","power","box"],"default":"rca"},"bg":{"editor":"enum","options":["studio","sweep","white","checker","checkerdark","custom","raw"],"default":"studio"},"shadow":{"editor":"boolean","default":true},"strength":{"editor":"range","min":0,"max":100,"default":60},"scale":{"editor":"range","min":30,"max":100,"default":78,"unit":"%"},"custom":{"editor":"color","default":"#3d4b5a"},"$preview":{"width":400,"height":400}}'>
class Component extends DCLogic {
  renderVals() {
    const kind = this.props.kind ?? 'rca';
    const bg = this.props.bg ?? 'studio';
    const raw = bg === 'raw';
    const scale = Number(this.props.scale ?? 78);
    const shadowOn = (this.props.shadow ?? true) && !raw && bg !== 'checker' && bg !== 'checkerdark';
    const strength = Number(this.props.strength ?? 60);
    const labels = { rca: 'Black RCA interconnect with gold plugs', phono: 'Black phono interconnect with gold plugs and ground wire', speaker: 'Black speaker cable with gold spade terminals', power: 'Black power cord with UK plug', box: 'Black and silver power conditioner' };
    const shW = scale * 0.8, shH = Math.max(3, scale * 0.09);
    const top = (100 - scale) / 2 + scale * 0.9;
    return {
      bgClass: 'bg-' + bg, raw, scale,
      bgStyle: bg === 'custom' ? 'background: ' + (this.props.custom ?? '#3d4b5a') : '',
      showShadow: shadowOn && strength > 0,
      shW, shH, shL: (100 - shW) / 2, shO: Math.min(1, strength / 60), shT: top - shH / 2,
      isRca: kind === 'rca' || kind === 'phono', isPhono: kind === 'phono',
      isSpeaker: kind === 'speaker', isPower: kind === 'power', isBox: kind === 'box',
      label: labels[kind] || labels.rca
    };
  }
}
</script>
</body>
</html>
