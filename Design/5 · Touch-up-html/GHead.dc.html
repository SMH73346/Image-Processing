<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Header and tabs (current app)</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
<link rel="stylesheet" href="./studio.css">
<link rel="stylesheet" href="./gr.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="t-dark" style="background: var(--bg); color: var(--text); font-family: var(--font)">
  <header class="ghdr">
    <div class="ttl"><span class="logo" style="width: 26px; height: 26px"><dc-import name="Icon" n="image" s="15" hint-size="15px,15px"></dc-import></span>Product Image Studio</div>
    <span class="proj"><small>PROJECT</small>Hiend Cables</span>
    <span class="sp"></span>
    <span class="pill"><span class="dot ok"></span>Offline</span>
    <span class="pill"><span class="dot ok"></span>AI model ready</span>
  </header>
  <nav class="gtabs" aria-label="Pages">
    <sc-for list="{{tabs}}" as="t" hint-placeholder-count="7"><a class="{{t.cls}}" href="{{t.href}}"><span class="n">{{t.n}}</span>{{t.label}}</a></sc-for>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"tab":{"editor":"enum","options":["project","settings","run","review","touchup","export","app"],"default":"project"},"$preview":{"width":1376,"height":110}}'>
class Component extends DCLogic {
  renderVals() {
    const cur = this.props.tab ?? 'project';
    const T = [['project', '1 ·', 'Project', 'G-Project'], ['settings', '2 ·', 'Settings', 'G-Settings'], ['run', '3 ·', 'Run', 'G-Run'], ['review', '4 ·', 'Review', 'G-Review'], ['touchup', '5 ·', 'Touch-up', 'G-Touchup'], ['export', '6 ·', 'Export', 'G-Export'], ['app', '⚙', 'App', 'G-App']];
    return { tabs: T.map(([id, n, label, f]) => ({ n, label, href: f + '.dc.html', cls: id === cur ? 'on' : '' })) };
  }
}
</script>
</body>
</html>
